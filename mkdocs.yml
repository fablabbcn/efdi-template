site_name: Martín Ferreira · Bitácora EFDI
site_description: Bitácora de la Especialización en Fabricación Digital e Innovación (UTEC · Fab Lab Barcelona)
site_author: Martín Ferreira
copyright: Copyleft 2025 Martín Ferreira · GNU Free Documentation License
repo_name: martinfp642/martin_ferreira
site_url: https://martinfp642.github.io/martin_ferreira/
repo_url: https://github.com/martinfp642/martin_ferreira
edit_uri: edit/main/docs/

# ------------------------------------------------------------------
# Navegación. El editor de la bitácora (docs/editor.md) agrega
# entradas nuevas dentro de estas secciones: una línea por página.
# ------------------------------------------------------------------
nav:
  - Inicio: index.md
  - Sobre mí: about/me.md
  - Método: metodo/documentar.md
  - Tecnología y Fabricación:
      - MT01 · Sitio web: tecnicos/mt01-sitio-web.md
      - MT02-MT03: tecnicos/mt02-03.md
  - Diseño:
      - MD01: diseno/md01.md
  - Innovación:
      - MI01: innovacion/mi01.md
  - Proyecto Integrador:
      - Ideas iniciales: proyecto/proyecto.md
  - Referencias:
      - Web: ref/web.md
  - Editor: editor.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/martinfp642
      name: GitHub
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/fisicasimpleuy
      name: Física Simple
    - icon: fontawesome/solid/flask
      link: https://fisicabit.com
      name: fisicabit.com

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: white
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - scheme: slate
      primary: black
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Modo claro
  font:
    text: Montserrat
    code: Roboto Mono
  icon:
    logo: material/square
    repo: fontawesome/brands/github
    edit: material/pencil
  favicon: images/favicon.svg
  features:
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow
    - content.code.copy
    - content.action.edit

plugins:
  - search:
      lang: es
  - git-revision-date-localized:
      fallback_to_build_date: true
      locale: es
      type: date
  - redirects:
      redirect_maps:
        "about sitio web/sitio web-mt01.md": tecnicos/mt01-sitio-web.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - smarty
  - tables
  - toc:
      permalink: "¶"
      toc_depth: 3
  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path: docs
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - stylesheets/bitacora.css

extra_javascript:
  - javascripts/bitacora-editor.js
